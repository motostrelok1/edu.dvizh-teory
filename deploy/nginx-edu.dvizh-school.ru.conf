# Конфигурация nginx для edu.dvizh-school.ru
# Поместить в /etc/nginx/sites-available/edu.dvizh-school.ru и сделать симлинк:
#   ln -s /etc/nginx/sites-available/edu.dvizh-school.ru /etc/nginx/sites-enabled/
# Затем: nginx -t && systemctl reload nginx
#
# Перед этим создать каталог сайта:
#   mkdir -p /var/www/edu.dvizh-school.ru

server {
    listen 80;
    listen [::]:80;
    server_name edu.dvizh-school.ru;

    root /var/www/edu.dvizh-school.ru;
    index index.html;

    # Сжатие текстовых ресурсов
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Кэш статических ассетов со хэшем в имени (vite) и иллюстраций
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # При желании включить HTTPS позже (certbot):
    #   apt install certbot python3-certbot-nginx
    #   certbot --nginx -d edu.dvizh-school.ru
}
